<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AetherGate: deterministic token metering and resilient AI routing for multi-tenant LLM platforms." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // apply the stored theme before first paint (no flash)
      try {
        const t = localStorage.getItem('ag-theme')
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (e) {}
    </script>
    <title>AetherGate Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
